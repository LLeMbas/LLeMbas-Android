name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Nothing private in the repository
        run: scripts/hygiene.sh

      - name: Generated files match their sources
        run: |
          python3 scripts/fetch-tokens.py      # Tokens.kt matches tokens.lock.json
          python3 scripts/fetch-contract.py    # contract/ matches contract/lock.json
          python3 scripts/gen-strings.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ktlint 1.8.0 from Maven Central: the same jar the signed GitHub release wraps in a
      # shell header (checked byte for byte), from a host that does not 504 on release assets.
      - name: ktlint (hash-pinned)
        run: |
          curl -sSfL --retry 5 --retry-all-errors -o ktlint.jar https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar
          echo "369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab  ktlint.jar" | sha256sum -c
          java -jar ktlint.jar "app/src/**/*.kt" "*.kts" "app/*.kts"

      # The wake-word engine and model for the full build, hash-pinned (never in the repository).
      - name: Wake-word engine (hash-pinned)
        run: python3 scripts/fetch-wakeword.py

      # The wake phrases' token pieces are generated from the model's own tokenizer (bpe.model,
      # fetched above); the committed table must be what it gives.
      - name: Wake phrases match the model's tokenizer
        run: |
          python3 -m venv "$RUNNER_TEMP/wake"
          "$RUNNER_TEMP/wake/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/wake-requirements.txt
          "$RUNNER_TEMP/wake/bin/python" scripts/gen-wake-phrases.py --check

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and both builds
        run: ./gradlew --no-daemon testFullDebugUnitTest assembleFullDebug assembleFdroidDebug

      - name: Android lint (report only, for now)
        run: ./gradlew --no-daemon lintFullDebug
        continue-on-error: true

      # The test build a tester installs (Actions › this run › Artifacts): debug-signed with the
      # repository's public test key, so each one installs over the last. `full` is the one to
      # use; `fdroid` is the same app without the updater.
      - name: Name the test builds
        run: |
          mkdir test-builds
          short="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/full/debug/app-full-debug.apk "test-builds/llembas-android-debug-$GITHUB_RUN_NUMBER-$short.apk"
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk "test-builds/llembas-android-debug-$GITHUB_RUN_NUMBER-$short-fdroid.apk"
          (cd test-builds && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: llembas-android-debug-${{ github.run_number }}
          path: test-builds/
          if-no-files-found: error

      # The screens as the screenshot tests rendered them (app/src/test/.../shots), light and
      # dark, at a large and a small phone's size: the design is reviewed from these.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llembas-android-screenshots-${{ github.run_number }}
          path: app/build/screenshots/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
